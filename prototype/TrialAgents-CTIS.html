@keyframes rise{from{transform:translateY(12px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes glide{from{transform:translateX(6%);opacity:.55}to{transform:translateX(0);opacity:1}}
body{margin:0;background:#f4f6fa;color:#172638;font:15px/1.45 Inter,system-ui,sans-serif}
.layout{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:calc(100vh - 50px)}
main{padding:clamp(16px,3vw,42px);max-width:1670px;width:100%;margin:auto;align-self:start;margin-top:0}
@keyframes slide{from{transform:translateX(50px);opacity:.5}}
@media(max-width:800px){.layout{grid-template-columns:58px 1fr}
main{min-width:0}}
body{font-size:1rem}
main{min-width:0}
@media(min-width:801px){.layout{grid-template-columns:207px minmax(0,1fr)}}
html,body{height:100%}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.layout{flex:1;min-height:0;grid-template-rows:minmax(0,1fr);overflow:hidden}
@media(max-width:800px){.layout{grid-template-columns:58px minmax(0,1fr);margin-bottom:46px}}
.layout:has(> #rail[hidden]){grid-template-columns:minmax(0,1fr);margin-bottom:0}
.plh{display:block;line-height:1.6;-webkit-font-smoothing:antialiased}
.plh *,*.plh,.plh *::before,*.plh::before,.plh *::after,*.plh::after{box-sizing:border-box}
.plh{
  color-scheme: dark;

  --ta-background: hsl(210 8% 8%);
  --ta-foreground: hsl(0 0% 95%);
  --ta-border: hsl(210 6% 18%);
  --ta-card: hsl(210 7% 11%);
  --ta-card-foreground: hsl(0 0% 95%);
  --ta-card-border: hsl(210 6% 16%);

  --ta-sidebar: hsl(210 8% 5%);
  --ta-sidebar-foreground: hsl(0 0% 95%);
  --ta-sidebar-border: hsl(210 6% 14%);
  --ta-sidebar-accent: hsl(210 6% 13%);

  --ta-primary: hsl(148 44% 48%);
  --ta-primary-hover: hsl(148 44% 53%);
  --ta-primary-foreground: hsl(0 0% 100%);
  --ta-primary-soft: hsl(148 30% 18%);
  --ta-primary-soft-foreground: hsl(148 44% 80%);

  --ta-secondary: hsl(210 7% 16%);
  --ta-secondary-foreground: hsl(0 0% 92%);
  --ta-muted: hsl(210 7% 15%);
  --ta-muted-foreground: hsl(215 8% 68%);
  --ta-input: hsl(210 6% 30%);
  --ta-destructive: hsl(0 73% 51%);

  --ta-font-sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --ta-font-serif: Georgia, serif;
  --ta-font-mono: Menlo, ui-monospace, monospace;

  --ta-radius: 0.5rem;
  --ta-radius-sm: 0.375rem;
  --ta-shadow-card: 0 1px 2px rgb(0 0 0 / 0.22);
  --ta-shadow-floating: 0 8px 24px rgb(0 0 0 / 0.35);
  --ta-sidebar-width: 255px;
  --ta-topbar-height: 80px;
}
.plh .ta-section-label,.ta-section-label.plh{
  color: var(--ta-muted-foreground);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.plh .intel-app,.intel-app.plh{
  --ta-background: hsl(165 10% 9%);
  --ta-foreground: hsl(150 11% 96%);
  --ta-border: hsl(164 8% 23%);
  --ta-card: hsl(165 9% 14%);
  --ta-card-foreground: hsl(150 11% 96%);
  --ta-card-border: hsl(164 8% 24%);
  --ta-sidebar: hsl(168 13% 5%);
  --ta-sidebar-border: hsl(165 8% 23%);
  --ta-sidebar-accent: hsl(160 12% 16%);
  --ta-secondary: hsl(164 8% 18%);
  --ta-muted: hsl(164 8% 17%);
  --ta-muted-foreground: hsl(164 7% 72%);
  --ta-input: hsl(164 7% 32%);
  --ta-shadow-card: 0 1px 0 hsl(150 12% 32% / 0.08), 0 12px 30px rgb(0 0 0 / 0.16);
  --ta-topbar-height: 72px;
  min-height: 100vh;
  background: var(--ta-background);
  font-size: 16px;
}
.plh .intel-app .ta-section-label,.intel-app.plh .ta-section-label{ color: hsl(153 26% 72%); font-size: 12px; font-weight: 600; }
.plh .workspace-header,.workspace-header.plh{
  height: var(--ta-topbar-height);
  min-height: var(--ta-topbar-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
  padding: 0 32px 0 38px;
  border-bottom: 1px solid var(--ta-border);
  background: hsl(165 10% 11% / 0.97);
  box-shadow: 0 8px 28px rgb(0 0 0 / 0.1);
}
.plh .workspace-title,.workspace-title.plh{ display: flex; align-items: center; gap: 14px; }
.plh .workspace-title > button,.workspace-title.plh > button{ width: 28px; height: 28px; border: 0; background: transparent; color: var(--ta-foreground); cursor: pointer; }
.plh .workspace-title .ta-section-label,.workspace-title.plh .ta-section-label{ margin: 0; line-height: 1; }
.plh .workspace-title h1,.workspace-title.plh h1{ margin: 3px 0 0; font-size: 22px; }
@media (max-width: 760px){.plh .workspace-header,.workspace-header.plh{ height: auto; min-height: 100px; padding: 14px 16px; align-items: flex-start; flex-direction: column; }}
.plh .intel-app,.intel-app.plh{
  color-scheme: light;
  --ta-background: hsl(150 10% 97%);
  --ta-foreground: hsl(168 22% 10%);
  --ta-border: hsl(210 13% 88%);
  --ta-card: hsl(0 0% 100%);
  --ta-card-foreground: hsl(168 22% 10%);
  --ta-card-border: hsl(210 13% 88%);
  --ta-sidebar: hsl(168 13% 6%);
  --ta-sidebar-foreground: hsl(0 0% 97%);
  --ta-sidebar-border: hsl(165 8% 18%);
  --ta-sidebar-accent: hsl(164 10% 13%);
  --ta-primary: hsl(151 50% 42%);
  --ta-primary-hover: hsl(151 51% 36%);
  --ta-primary-soft: hsl(151 43% 94%);
  --ta-primary-soft-foreground: hsl(151 51% 28%);
  --ta-secondary: hsl(150 10% 96%);
  --ta-secondary-foreground: hsl(168 22% 12%);
  --ta-muted: hsl(150 10% 96%);
  --ta-muted-foreground: hsl(210 7% 39%);
  --ta-input: hsl(210 12% 76%);
  --ta-radius: 0.75rem;
  --ta-radius-sm: 0.5rem;
  --ta-shadow-card: 0 1px 2px rgb(20 31 27 / 0.04), 0 8px 24px rgb(20 31 27 / 0.045);
  --ta-shadow-floating: 0 14px 34px rgb(20 31 27 / 0.16);
  background: var(--ta-background);
  color: var(--ta-foreground);
}
.plh .intel-app .ta-section-label,.intel-app.plh .ta-section-label{ color: hsl(151 47% 32%); font-size: 12px; }
.plh .intel-app .workspace-header,.intel-app.plh .workspace-header{
  min-height: 78px;
  height: 78px;
  border-color: hsl(210 13% 89%);
  background: hsl(0 0% 100% / 0.98);
  box-shadow: none;
}
.plh .intel-app .workspace-title > button,.intel-app.plh .workspace-title > button{
  display: grid;
  place-items: center;
  border-radius: 7px;
  color: hsl(210 7% 34%);
}
.plh .intel-app .workspace-title > button:hover,.intel-app.plh .workspace-title > button:hover{ background: hsl(150 10% 95%); color: var(--ta-primary); }
@media (max-width: 760px){.plh .intel-app .workspace-header,.intel-app.plh .workspace-header{ height: auto; min-height: 106px; }}
.plh .root,.root.plh{
  --site-ink: var(--ta-foreground);
  --site-muted: var(--ta-muted-foreground);
  --site-line: var(--ta-border);
  --site-soft: var(--ta-muted);
  --site-green: var(--ta-primary);
  --site-green-soft: var(--ta-primary-soft);
  font-family: var(--ta-font-sans);
  font-size: 16px;

 const list=[];
 if(q.heading)list.push({key:q.n+'h',text:q.heading});

function locatePart(part,frags){
 const frag=frags.get(part.key);if(!frag)return null;
 let start=part.from;
 if(frag.text.slice(start,start+part.text.length)!==part.text){start=frag.text.indexOf(part.text);if(start<0||start!==frag.text.lastIndexOf(part.text))return null}

}

function reviewerAction(a,b){
 const ctx=reviewCtx();if(!ctx)return false;
 const {m,k,d,w}=ctx,id=Number(b.dataset.t),r=reading,ts=reviewThreads(d,k),t=ts.find(t=>t.id===id);
 if(a==='approve-owner'){
  const key=approvalKey(P(),d);if(actor===owner&&k.id===lastApplicable(P(),d)?.id&&key){d.approval={by:owner,key};d.lastApproved={rev:work(d,k).current.rev,at:now()};refresh();cellDlg(m.id,k.id);toast('Final document approved')}
 }else if(a==='focus-thread')chooseThread(id,true);
 else if(a==='selection-comment'||a==='new-thread'){
  const sel=a==='selection-comment'?r.selection:null;if(a==='selection-comment'&&!sel)return true;
  r.parts=sel?.parts||[];r.region=sel?.region||null;clearSelection();startCompose('new',sel?.n||0,sel?.quote||'')
 }
 else if((a==='reply'||a==='reply-mention')&&t){r.thread=id;startCompose('reply',t.anchor,t.quote);if(a==='reply-mention')$('.taglist').hidden=false}
 else if(a==='thread-resolve'&&t){t.closed=!t.closed;r.thread=t.closed?0:t.id;r.compose=null;refresh();cellDlg(m.id,k.id)}
 else if(a==='thread-copy'&&t){copyText(dcode(m.id,k)+' #'+t.id+' · v'+t.rev+'\n'+(t.quote?t.quote+'\n':'')+t.by+': '+t.text+t.replies.map(z=>'\n'+z.by+': '+z.text).join(''))}
 else if(a==='history'){r.history=!r.history;repaintRail()}
 else if(a==='toolbar-invite'){
  r.invite=!r.invite;$('#rail-invite-form').hidden=!r.invite;
  const toggle=$('.readerToolbar [data-a="toolbar-invite"]');toggle.setAttribute('aria-expanded',String(r.invite));
  (r.invite?$('#invite-address'):toggle)?.focus()
 }
 else if(a==='cancel-compose'){r.compose=null;r.draft='';repaintRail()}
 else if(a==='show-tags'){const menu=$('.taglist');if(menu)menu.hidden=!menu.hidden}
 else if(a==='insert-tag'){
  const field=$('#thread-text'),value=field.value,pos=field.selectionStart??value.length,left=value.slice(0,pos);
  const start=left.search(/@[\w.+-]*$/),prefix=start<0?left+(left&&!/\s$/.test(left)?' ':''):left.slice(0,start);
  field.value=prefix+'@'+b.dataset.person+' '+value.slice(pos);r.draft=field.value;field.focus();field.setSelectionRange(prefix.length+b.dataset.person.length+2,prefix.length+b.dataset.person.length+2);$('.taglist').hidden=true
 }else return false;return true
}

 const field=e.target,pos=field.selectionStart??field.value.length,match=field.value.slice(0,pos).match(/(?:^|\s)@([\w.+-]*)$/);const menu=$('.taglist');if(!menu)return;

function submitReview(e){
 const ctx=reviewCtx();if(!ctx)return false;const {m,k,d,w}=ctx,r=reading;
 if(e.target.id==='rail-invite-form'){
  const email=$('#invite-address').value.trim(),role=$('#invite-access').value;const old=w.invites.find(x=>x.email.toLowerCase()===email.toLowerCase());
  if(old)old.role=role;else w.invites.push({email,role});r.invite=false;
  refresh();cellDlg(m.id,k.id);$('.readerToolbar [data-a="toolbar-invite"]')?.focus();toast('Invitation sent');return true
 }
 if(e.target.id!=='threadform')return false;const text=$('#thread-text').value.trim();if(!text)return true;
 const mentioned=members(w).filter(u=>text.includes('@'+u));let t;
 if(r.compose==='reply'){t=w.threads.find(t=>t.id===r.thread);if(!t)return true;t.replies.push({by:actor,text,mentioned,rev:w.current?.rev||0})}
 else t=addThread(w,{text,kind:'Comment',anchor:r.anchor||0,parts:r.parts||[],region:r.region||null,quote:r.quote,mentioned});
 r.compose=null;r.thread=t.id;r.draft='';r.quote='';refresh();cellDlg(m.id,k.id);chooseThread(t.id);return true
}

function docNeedsAction(plan,d){return plan.steps.some(k=>{try{return liveState(d,k)[0]==='action'}catch{return false}})}

function projectStats(p){
 const plan=planOf(p);if(!plan)return {total:0,ready:0,action:0};
 const ids=Object.keys(plan.docs);let ready=0,action=0;
 const keep=data.active;data.active=plan.id;
 for(const id of ids){try{if(released(plan,plan.docs[id]))ready++;if(docNeedsAction(plan,plan.docs[id]))action++}catch{}}
 data.active=keep;
 return {total:ids.length,ready,action};
}

function liveState(d,s){
 if(s.skip||d.rowSkip?.[s.id])return ['na','Not applicable'];
 {const first=P().steps.find(k=>!k.skip&&!d.rowSkip?.[k.id]),rid=refOf(docIdOf(d));
  if(rid&&first?.id===s.id&&s.type==='draft'&&!refApproved(rid)&&!work(d,s).current)return ['waiting','Waiting for reference']}
 const steps=P().steps.filter(k=>!k.skip&&!d.rowSkip?.[k.id]),idx=steps.findIndex(k=>k.id===s.id);
 const passed=k=>d.ignored?.[k.id]!=null&&d.ignored[k.id]===work(d,k).current?.rev;
 if(idx>0&&steps.slice(0,idx).some(k=>issuesOpen(d,k)&&!passed(k)))return ['waiting','Waiting'];
 const w=work(d,s);if(!w.current||w.status!=='Complete')return ['waiting','Waiting'];
 return issuesOpen(d,s)?['action','Action required']:['done','Done'];
}

function applyWide(pid,cat,ids){
 const p=data.projects.find(x=>x.id===pid);
 for(const r of data.resources.filter(x=>x.cat===cat)){
  const on=ids.includes(String(r.id)),was=wide(r,pid);

 if(b.dataset.revise!==undefined&&panel?.name==='cell'){const k=lookupStep(panel.sid),open=reviewThreads(doc(panel.id),k).filter(t=>!t.closed).length;log('Browser','Requested revision',proj()?.code+' · '+dcode(panel.id,k));persist();toast(open?'Sent to the assistant: revise '+dcode(panel.id,k)+' using '+open+' open comment'+(open>1?'s':''):'Sent to the assistant: '+dcode(panel.id,k)+' has no open comments, so it will ask what to change');return}
 if(b.classList.contains('sidebar-toggle')){const r=elx('rail');r.hidden=!r.hidden;b.setAttribute('aria-expanded',String(!r.hidden));b.title=b.ariaLabel=r.hidden?'Show sidebar':'Hide sidebar'}
});
elx('drawer').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left)closeDrawer()}});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.closest('form[data-logf]')&&t.tagName==='SELECT'){data.ui.logf={...(data.ui.logf||{}),[t.name]:t.value};render();return}
 if(t.name==='gscope'){elx('grant-detail').hidden=t.value==='project';elx('grant-step').hidden=t.value!=='deliverable';return}
 const ff=t.closest('form[data-filters]');if(ff){const f=ff.dataset.filters==='template'?tplFilter:srcFilter;if(t.name!=='q'){f[t.name]=t.value;render()}return}
 if(t.name==='mode'&&drawerState?.type==='res'){drawerState.mode=t.value;const r=data.resources.find(x=>x.id===drawerState.id)||{};elx('file-slot').innerHTML=fileSlot(r);return}
 if(t.name==='upload'&&t.files?.[0]){const f=t.files[0];drawerState.pendingFile={name:f.name,size:f.size};if(f.size<=1500000){const rd=new FileReader();rd.onload=()=>{if(drawerState)drawerState.pendingFile.blob=rd.result};rd.readAsDataURL(f)}return}
});
document.addEventListener('input',e=>{if(e.target.classList.contains('pickinput')){pickerResults(e.target.closest('.picker'));return}});
document.addEventListener('focusin',e=>{if(e.target.classList?.contains('pickinput'))pickerResults(e.target.closest('.picker'))});
document.addEventListener('pointerdown',e=>{for(const ul of document.querySelectorAll('.pickresults:not([hidden])'))if(!ul.closest('.picker').contains(e.target))ul.hidden=true});
document.addEventListener('keydown',e=>{if(e.target.classList?.contains('pickinput')){if(e.key==='Enter'){e.preventDefault();e.target.closest('.picker').querySelector('[data-pick]')?.click()}if(e.key==='Escape'){e.stopPropagation();e.target.closest('.picker').querySelector('.pickresults').hidden=true}if(e.key==='Backspace'&&!e.target.value){const c=[...e.target.closest('.picker').querySelectorAll('.pickchip')].at(-1);c?.querySelector('[data-unpick]').click()}}},true);
document.addEventListener('input',e=>{const ff=e.target.closest('form[data-filters]');if(ff&&e.target.name==='q'){const f=ff.dataset.filters==='template'?tplFilter:srcFilter;f.q=e.target.value;const pos=e.target.selectionStart;render();const i=document.querySelector('form[data-filters] input[name=q]');i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{
 const f=e.target,fd=new FormData(f),get=k=>String(fd.get(k)||'').trim(),out=f.querySelector('output'),done=t=>{persist();if(out)out.textContent=t;else toast(t)};
 if(f.id==='resform'){e.preventDefault();
  const isNew=!drawerState.id,r=isNew?{id:Math.max(0,...data.resources.map(x=>x.id))+1,cat:drawerState.cat,via:'Browser',by:actor,added:now(),used:[],mode:'',projects:[]}:data.resources.find(x=>x.id===drawerState.id);
  Object.assign(r,{name:get('name'),kind:get('kind')==='SOP or guideline'?'Internal guideline':get('kind'),version:get('version'),scope:get('scope')||'All',detail:get('detail')});
  if(isNew&&get('addProject')&&!r.projects.includes(get('addProject'))){r.projects.push(get('addProject'));log('Browser','Added '+(r.cat==='template'?'template':'source')+' to project',pcode(get('addProject'))+' · '+r.name)}
  if(r.cat==='template'){r.lang=get('lang');r.doctype=get('doctype')}else r.date=get('date');
  const mode=drawerState.mode;
  if(mode==='link'){const l=get('link');if(l){try{const u=new URL(l);if(!['http:','https:'].includes(u.protocol))throw 0;r.link=u.href}catch{toast('Enter an http or https link.');return}}else r.link='';r.file=null;delete r.blob;r.mode='External link'}
  else if(mode==='file'){if(drawerState.pendingFile){r.file={name:drawerState.pendingFile.name,size:drawerState.pendingFile.size};if(drawerState.pendingFile.blob)r.blob=drawerState.pendingFile.blob;else delete r.blob}else if(!r.file){toast('Choose a file, or keep the record as name only.');return}r.link='';r.mode='Saved'}
  else{r.file=null;r.link='';delete r.blob;r.mode='Chat only'}
  if(isNew)data.resources.push(r);log('Browser',(isNew?'Recorded ':'Updated ')+(r.cat==='template'?'template':'source'),r.name+(r.version?' v'+r.version:''));
  if(!persist()){delete r.blob;r.file&&(r.file.size=r.file.size);persist();toast('Browser storage is full. The record was saved without the file copy.')}
  closeDrawer();render();toast(isNew?'Recorded':'Saved');return}
 if(f.id==='projectform'){e.preventDefault();const countries=fd.getAll('countries'),ws=fd.getAll('wideSources'),wt=fd.getAll('wideTemplates');
  const vals={name:get('name'),code:get('code').toUpperCase(),euct:get('euct'),sponsor:get('sponsor'),countries,updated:now()};
  const plv={part1:get('part1'),ref:countries.includes(get('ref').split(':')[0])?get('ref'):'',format:get('format')};
  if(drawerState.id){const p=data.projects.find(x=>x.id===drawerState.id);Object.assign(p,vals);{const pl=(data.planning??={})[p.id]??={basedOn:{}};const ch=Object.keys(plv).filter(k=>pl[k]!==plv[k]);Object.assign(pl,plv);if(ch.length)log('Browser','Changed planning choices',p.code+' · '+ch.join(', '))}if(p.planId&&data.ui.project===p.id)data.project=p.name;applyWide(p.id,'source',ws);applyWide(p.id,'template',wt);log('Browser','Updated project',p.name);closeDrawer();refresh();toast('Project saved');return}
  const id='PRJ'+Date.now().toString(36).toUpperCase(),from=drawerState.from?data.projects.find(x=>x.id===drawerState.from):null;
  const np={id,...vals,owner:actor,created:now(),planId:''};(data.planning??={})[id]={...plv,basedOn:{...(from&&data.planning?.[from.id]?.basedOn||{})}};
  if(from){const base=planOf(from);if(base)np.planId=clonePlanFor(base,vals.name);}
  data.projects.push(np);applyWide(id,'source',ws);applyWide(id,'template',wt);
  log('Browser',from?'Duplicated project':'Created project',vals.name+(from?' from '+from.name:''));closeDrawer();openProject(id);toast(from?'Copy created':'Project created');return}
 if(f.id==='docform'){e.preventDefault();const p=proj(),did=drawerState.id,d=planOf(p).docs[did],sel=[...fd.getAll('docSources'),...fd.getAll('docTemplates')].map(Number);
  const wideIds=data.resources.filter(r=>wide(r,p.id)).map(r=>r.id);
  d.resAdd=sel.filter(id=>!wideIds.includes(id));d.resRemove=wideIds.filter(id=>!sel.includes(id));
  (planning().docSources??={})[did]=fd.getAll('docProject');
  log('Browser','Changed document sources and templates',p.code+' · '+def(did).name);closeDrawer();refresh();if(panel?.name==='cell')cellDlg(panel.id,panel.sid);toast('Saved for this document');return}
 if(f.id==='profileform'){e.preventDefault();if(actor!==owner){done('Profile saved');return}Object.assign(data.profile,{name:get('name'),title:get('title'),org:get('org'),tz:get('tz'),lang:get('lang')});done('Profile saved');return}
 if(f.id==='securityform'){e.preventDefault();return}
 if(f.id==='projectsettings'){e.preventDefault();const p=proj();Object.assign(p,{name:get('name'),phase:get('phase'),sponsor:get('sponsor'),updated:now()});if(p.planId)data.project=p.name;done('Project saved');return}
 if(f.id==='plandefaults'){e.preventDefault();data.defaults.steps=fd.getAll('steps');data.defaults.pattern=get('pattern');data.dense=fd.has('dense');done('Defaults saved');return}
 if(f.id==='inviteform'){e.preventDefault();const st=drawerState,role=get('role');let g;
  if(st.doc){const scope=get('scope')||'deliverable';g={project:st.project,scope,doc:scope==='project'?'':st.doc,sid:scope==='deliverable'?st.sid:null,role}}
  else{const scope=get('gscope');g={project:get('gproject'),scope,doc:scope==='project'?'':get('gdoc'),sid:scope==='deliverable'?+get('gstep'):null,role}}
  let s=st.shareIndex!=null?data.shares[st.shareIndex]:data.shares.find(x=>x.email.toLowerCase()===get('email').toLowerCase());
  if(!s){s={email:get('email'),opened:false,sent:now(),grants:[]};data.shares.push(s)}
  const same=s.grants.find(x=>x.project===g.project&&x.scope===g.scope&&x.doc===g.doc&&x.sid===g.sid);if(same)same.role=role;else s.grants.push(g);
  log('Browser','Shared',s.email+' · '+scopeLabel(g)+' · '+roleName(role));closeDrawer();persist();if(route==='settings')render();toast('Shared with '+s.email);return}
 if(f.id==='memberform'){e.preventDefault();const s=data.shares[drawerState.i];s.grants.forEach((g,gi)=>{const r=fd.get('role'+gi);if(r)g.role=r});log('Browser','Changed access',s.email);closeDrawer();refresh();toast('Access updated');return}
 if(f.id==='logform'){e.preventDefault();logQuery=get('query');render();return}
 if(f.id==='prefsform'){e.preventDefault();for(const k of Object.keys(data.prefs))data.prefs[k]=fd.has(k);done('Preferences saved');return}
 if(f.id==='supportform'){e.preventDefault();f.reset();done('Message sent to support');return}
 if(f.closest('form[data-filters]')||f.dataset.filters){e.preventDefault();return}
},true);

data=upgrade(data);
